<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapala UIN Palopo | Salam Lestari</title>
    <style>
        /* Pengaturan Dasar & Font */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            line-height: 1.6;
            color: #333;
            background-color: #f9f9f9;
        }

        /* Navigasi (Header) */
        header {
            background-color: #1b5e20; /* Hijau Gelap Alam */
            color: white;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header h1 {
            font-size: 1.5rem;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #81c784;
        }

        /* Bagian Utama (Hero Section) */
        .hero {
            background: linear-gradient(rgba(27, 94, 32, 0.7), rgba(0, 0, 0, 0.6)), url('https://images.unsplash.com/photo-1519331379826-f10be5486c6f?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80') center/cover;
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 20px;
        }
        .hero h2 {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .hero p {
            font-size: 1.2rem;
            margin-bottom: 20px;
            max-width: 600px;
        }
        .btn {
            background-color: #4caf50;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #388e3c;
        }

        /* Bagian Konten (Tentang & Kegiatan) */
        section {
            padding: 4rem 5%;
            text-align: center;
        }
        section h3 {
            font-size: 2rem;
            color: #1b5e20;
            margin-bottom: 20px;
        }
        .kegiatan-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 300px;
            text-align: left;
        }
        .card h4 {
            color: #2e7d32;
            margin-bottom: 10px;
        }

        /* Footer */
        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 20px;
        }

        /* Responsif untuk HP */
        @media (max-width: 768px) {
            nav ul {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
            header {
                flex-direction: column;
            }
            .hero h2 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Mapala UIN Palopo</h1>
        <nav>
            <ul>
                <li><a href="#beranda">Beranda</a></li>
                <li><a href="#tentang">Tentang Kami</a></li>
                <li><a href="#kegiatan">Kegiatan</a></li>
                <li><a href="#kontak">Kontak</a></li>
            </ul>
        </nav>
    </header>

    <div id="beranda" class="hero">
        <h2>Salam Lestari!</h2>
        <p>Mahasiswa Pecinta Alam Universitas Islam Negeri Palopo. Menjaga bumi, melestarikan alam, dan mengabdi untuk masyarakat.</p>
        <a href="#tentang" class="btn">Kenali Kami Lebih Jauh</a>
    </div>
